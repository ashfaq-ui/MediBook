spring.application.name=MediBook
server.port=${PORT:8080}

# Docker Compose publishes PostgreSQL on host port 5433.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5433/medibook}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:medibookpassword}
spring.datasource.hikari.connection-timeout=5000

# Existing schema and data must remain intact during the rebuild.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=never

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}

app.cookie-secure=${COOKIE_SECURE:false}
app.frontend-url=${FRONTEND_URL:http://localhost:3000}
app.admin-email=${ADMIN_EMAIL:}
app.admin-password=${ADMIN_PASSWORD:}
app.mail-enabled=${MAIL_ENABLED:false}
app.mail-from=${MAIL_FROM:noreply@localhost}
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.timezone=${CLINIC_TIMEZONE:Asia/Colombo}

app.ollama-url=${OLLAMA_URL:http://localhost:11434}
app.ollama-model=${OLLAMA_MODEL:}
